name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full release checks
        run: bash scripts/check-release.sh

  windows:
    name: Windows PowerShell 5.1 validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell files
        shell: powershell
        run: |
          $Failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ParseError in @($Errors)) {
              $Failed = $true
              $Extent = $ParseError.Extent
              Write-Host "::error file=$($_.FullName),line=$($Extent.StartLineNumber),col=$($Extent.StartColumnNumber)::$($ParseError.Message) | token: $($Extent.Text)"
            }
          }
          if ($Failed) { exit 1 }
