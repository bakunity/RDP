name: Apply control-state stabilization patch

on:
  push:
    branches:
      - fix/control-state-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin fix/control-state-dashboard
          git checkout -B fix/control-state-dashboard FETCH_HEAD

      - name: Apply patch
        run: |
          cd repo
          python3 scripts/_apply_control_state_patch.py

      - name: Run release checks
        run: |
          cd repo
          bash scripts/check-release.sh

      - name: Commit result
        run: |
          cd repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make tunnel control state truthful"
          git push origin HEAD:fix/control-state-dashboard
