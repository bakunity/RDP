name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: prepare-v1-1-0
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-22.04
    steps:
      - name: Clone tested branch without marketplace actions
        run: |
          set -Eeuo pipefail
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone \
            --depth=1 \
            --branch "$BRANCH" \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            repo
      - name: Full release checks
        working-directory: repo
        run: bash scripts/check-release.sh

  windows:
    name: Windows PowerShell 5.1 validation
    runs-on: windows-2022
    steps:
      - name: Clone tested branch without marketplace actions
        shell: powershell
        run: |
          $Branch = if ($env:GITHUB_HEAD_REF) {
            $env:GITHUB_HEAD_REF
          }
          else {
            $env:GITHUB_REF_NAME
          }
          git clone `
            --depth=1 `
            --branch $Branch `
            "https://github.com/$env:GITHUB_REPOSITORY.git" `
            repo
      - name: Parse all PowerShell files
        shell: powershell
        working-directory: repo
        run: |
          $Failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ParseError in @($Errors)) {
              $Failed = $true
              $Extent = $ParseError.Extent
              Write-Host "::error file=$($_.FullName),line=$($Extent.StartLineNumber),col=$($Extent.StartColumnNumber)::$($ParseError.Message) | token: $($Extent.Text)"
            }
          }
          if ($Failed) { exit 1 }
      - name: Execute static certificate pinning test
        shell: powershell
        working-directory: repo
        run: .\tests\Test-PinnedHttpClient.ps1
