name: Prepare v1.0.6 BOM bootstrap hotfix

on:
  push:
    branches:
      - fix/powershell-bom-bootstrap-v1-0-6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/powershell-bom-bootstrap-v1-0-6

      - name: Prepare patch
        run: python3 .github/prepare_v1_0_6.py

      - name: Validate release tree
        run: bash scripts/check-release.sh

      - name: Commit patch
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: strip decoded BOM before PowerShell bootstrap'
          git push
