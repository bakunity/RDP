name: Build OpenSSH docs and website refresh

on:
  push:
    branches: [feat/docs-site-openssh-refresh]
    paths:
      - '.github/docs-site-refresh.trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feat/docs-site-openssh-refresh
    steps:
      - name: Fetch branch
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD

      - name: Refresh website and documentation
        run: |
          cd repo
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          tag = f"v{version}"

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("RDP, FRP, Windows", "RDP, OpenSSH, Windows")
          index = index.replace('"softwareVersion": "1.0.7"', f'"softwareVersion": "{version}"')
          index = index.replace("v1.0.7", tag)
          index = index.replace("Стабильный релиз v1.0.7", f"OpenSSH-релиз {tag}")
          index = index.replace("<span>FRPS</span><strong>ACTIVE</strong>", "<span>SSHD</span><strong>ACTIVE</strong>")
          index = index.replace("FRPC + RDP Agent", "OpenSSH + Hermes Agent")
          index = index.replace(
              "Агент собирает метрики, получает команды и поднимает персональный FRP-туннель.",
              "Агент собирает метрики, получает команды и поддерживает reverse SSH-туннель системным ssh.exe.",
          )
          index = index.replace(
              "FRPS, HTTPS API, SQLite registry и Telegram controller работают как единый управляющий узел.",
              "Изолированный sshd, HTTPS API, SQLite registry и Telegram controller работают как единый управляющий узел.",
          )
          index = index.replace("<div class=\"flow-arrow\"><span>TLS</span>", "<div class=\"flow-arrow\"><span>SSH</span>", 1)
          index = index.replace(
              "<strong>TLS 1.2+</strong><small>HTTPS API и принудительный TLS для FRP.</small>",
              "<strong>Два закреплённых канала</strong><small>SHA-256 pinning HTTPS API и отдельный SSH host key.</small>",
          )
          index = index.replace(
              "Контроллер, FRP-сервер, API и реестр устройств работают на вашем Linux-сервере.",
              "Контроллер, изолированный OpenSSH daemon, API и реестр устройств работают на вашем Linux-сервере.",
          )
          index = index.replace(
              "Версия 1.0.7 является стабильной, но перед production-развёртыванием рекомендуется пройти полный гайд тестирования и изучить документ безопасности.",
              f"Ветка {tag} прошла чистую установку, pairing и внешний RDP-тест. Перед постоянной эксплуатацией всё равно пройдите acceptance checklist и настройте сильные Windows-пароли.",
          )
          index = index.replace(
              "<a href=\"#install\">Установка</a>",
              "<a href=\"#install\">Установка</a>\n        <a href=\"#docs\">Документация</a>",
          )
          index = index.replace(
              "<span><i></i> Self-hosted</span>",
              "<span><i></i> System OpenSSH</span>",
          )
          index = index.replace(
              "<button type=\"button\">⚙ Settings</button>",
              "<button type=\"button\">⏸ LIVE 3s</button>",
          )

          server_code = f'''<pre id="code-server"><code><span class="comment"># Скачать установщик фиксированного релиза</span>
curl -fsSL https://raw.githubusercontent.com/bakunity/RDP/{tag}/scripts/install-server.sh \\
  -o /tmp/install-hermes-rdp.sh

<span class="comment"># Токен не выводится в историю команд</span>
read -rsp 'Telegram bot token: ' TG_TOKEN; echo
sudo env HERMES_RDP_REF={tag} bash /tmp/install-hermes-rdp.sh \\
  --host SERVER_IP_OR_DOMAIN \\
  --telegram-token "$TG_TOKEN" \\
  --telegram-chat-id TELEGRAM_USER_ID
unset TG_TOKEN</code></pre>'''
          index, count = re.subn(
              r'<pre id="code-server">.*?</pre>',
              server_code,
              index,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("server code block not found")

          pair_code = '''<pre id="code-pair"><code><span class="comment"># В Telegram-боте</span>
/start

<span class="output">Нажмите: ➕ ДОБАВИТЬ ПК
Бот создаст одноразовый код и готовую PowerShell-команду.</span></code></pre>'''
          index, count = re.subn(
              r'<pre id="code-pair">.*?</pre>',
              pair_code,
              index,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("pair code block not found")

          windows_code = '''<pre id="code-windows"><code><span class="comment"># PowerShell от имени администратора</span>
<span class="comment"># Скопируйте готовый блок из Telegram целиком</span>
$u='URL_ИЗ_TELEGRAM'
$s=(irm $u).TrimStart([char]0xFEFF)
$p=@{
  Server='SERVER_IP_OR_DOMAIN'
  PairCode='ОДНОРАЗОВЫЙ_КОД'
  Fingerprint='SHA256_HEX'
  RepositoryRef='RELEASE_TAG'
}
&amp; ([scriptblock]::Create($s)) @p</code></pre>'''
          index, count = re.subn(
              r'<pre id="code-windows">.*?</pre>',
              windows_code,
              index,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Windows code block not found")

          validation = '''    <section class="section section-validated" id="validated">
      <div class="container">
        <div class="section-heading reveal">
          <span class="eyebrow">REAL-WORLD VALIDATION</span>
          <h2>Проверено не только тестами</h2>
          <p>OpenSSH-версия прошла полный путь на отдельном Debian-сервере и Windows-ПК: от чистой установки до внешнего RDP-подключения.</p>
        </div>

        <div class="validation-grid">
          <article class="validation-card reveal">
            <span class="validation-status">PASS</span>
            <strong>Чистый сервер</strong>
            <p>Новая SQLite-база, отдельный sshd, HTTPS API и Telegram-панель без FRP-зависимостей.</p>
          </article>
          <article class="validation-card reveal">
            <span class="validation-status">PASS</span>
            <strong>Windows pairing</strong>
            <p>Ed25519-ключ создан локально, Scheduled Task запущена, наружу передан только public key.</p>
          </article>
          <article class="validation-card reveal">
            <span class="validation-status">PASS</span>
            <strong>Внешняя сеть</strong>
            <p>RDP-подключение подтверждено с телефона через мобильные данные, вне локальной сети компьютера.</p>
          </article>
          <article class="validation-card validation-warning reveal">
            <span class="validation-status">ВАЖНО</span>
            <strong>Защитите Windows-вход</strong>
            <p>Используйте сильный пароль, обновления Windows и ограничение источников в firewall там, где это возможно.</p>
          </article>
        </div>
      </div>
    </section>

'''
          docs_marker = '    <section class="section" id="docs">'
          if docs_marker not in index:
              raise SystemExit("docs section marker not found")
          index = index.replace(docs_marker, validation + docs_marker, 1)

          index = index.replace(
              "Проект разворачивается на вашей инфраструктуре. Устройства регистрируются отдельно, секреты не публикуются в репозитории, а доступ к панели ограничен выбранным Telegram ID.",
              "Проект разворачивается на вашей инфраструктуре. Каждый ПК получает отдельный API-token, SSH-ключ и разрешение только на свой RDP-порт. Доступ к Telegram-панели ограничен выбранным ID.",
          )
          index = index.replace(
              "Self-hosted multi-PC RDP gateway with Telegram control.",
              "Self-hosted multi-PC RDP gateway powered by system OpenSSH and Telegram control.",
          )
          index = index.replace(
              "Built for predictable remote access.",
              "OpenSSH transport · predictable remote access.",
          )

          stale = ["FRPC", "FRPS", "FRP-сервер", "v1.0.7"]
          for token in stale:
              if token in index:
                  raise SystemExit(f"stale website token remains: {token}")
          index_path.write_text(index, encoding="utf-8")

          css_path = root / "assets/styles.css"
          css = css_path.read_text(encoding="utf-8")
          marker = "/* OpenSSH validation refresh */"
          if marker not in css:
              css += r'''

/* OpenSSH validation refresh */
