name: Validate docs and site

on:
  push:
    branches: [feat/docs-site-openssh-refresh]
    paths:
      - '.github/docs-validation.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Clone tested branch without marketplace actions
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --branch feat/docs-site-openssh-refresh \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Full project checks
        working-directory: repo
        run: |
          set -Eeuo pipefail
          bash scripts/check-release.sh
          node --check assets/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          html = Path('index.html').read_text(encoding='utf-8')
          Parser().feed(html)
          required = [
              'OpenSSH',
              'REAL-WORLD VALIDATION',
              'мобильные данные',
              'permitlisten',
          ]
          for value in required:
              if value not in html:
                  raise SystemExit(f'missing public-site content: {value}')
          print('html-parse=OK')
          PY
