name: Sanitize public examples

on:
  push:
    branches:
      - docs-sanitize-test-guide-v1-0-1

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-sanitize-test-guide-v1-0-1

      - name: Replace project-specific examples
        shell: python
        run: |
          from __future__ import annotations

          import ipaddress
          import re
          from pathlib import Path

          replacements = [
              ('::ffff:213.193.241.1', 'CLIENT_IP_ADDRESS'),
              ('31.76.77.87', 'SERVER_IP_OR_DOMAIN'),
              ('213.193.241.1', 'CLIENT_IP_ADDRESS'),
              ('10.20.0.1', 'INTERNAL_GATEWAY'),
              ('hermes.play2go.cloud', 'SERVER_DOMAIN'),
              ('play2go.cloud', 'EXAMPLE_DOMAIN'),
              ('MS-7D98', 'WINDOWS-PC-01'),
              ('Домашний ПК', 'Windows-PC-01'),
              ('TIIT', 'WINDOWS_USER'),
              ('tiit', 'WINDOWS_USER'),
              ('timas', 'SERVER_USER'),
          ]

          text_suffixes = {
              '.md', '.py', '.ps1', '.sh', '.toml', '.yml', '.yaml',
              '.json', '.txt', '.ini', '.cfg', '.service'
          }
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'VERSION'}:
                  continue
              raw = path.read_bytes()
              has_bom = raw.startswith(b'\xef\xbb\xbf')
              try:
                  text = raw.decode('utf-8-sig')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  prefix = b'\xef\xbb\xbf' if has_bom else b''
                  path.write_bytes(prefix + updated.encode('utf-8'))
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(f'  {item}')

          forbidden = [old for old, _ in replacements]
          ipv4_pattern = re.compile(r'(?<![A-Za-z0-9_])(?:\d{1,3}\.){3}\d{1,3}(?![A-Za-z0-9_])')
          documentation_networks = [
              ipaddress.ip_network('192.0.2.0/24'),
              ipaddress.ip_network('198.51.100.0/24'),
              ipaddress.ip_network('203.0.113.0/24'),
          ]
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'VERSION'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except UnicodeDecodeError:
                  continue
              for value in forbidden:
                  if value in text:
                      failures.append(f'{path}: forbidden value {value!r}')
              for match in ipv4_pattern.finditer(text):
                  value = match.group(0)
                  try:
                      address = ipaddress.ip_address(value)
                  except ValueError:
                      continue
                  allowed = (
                      address.is_loopback
                      or address.is_private
                      or address.is_link_local
                      or address.is_unspecified
                      or any(address in network for network in documentation_networks)
                  )
                  if not allowed:
                      line = text.count('\n', 0, match.start()) + 1
                      failures.append(f'{path}:{line}: public IPv4 {value}')
          if failures:
              raise SystemExit('Sanitization failed:\n' + '\n'.join(failures))
          print('Privacy scan: PASS')

      - name: Update existing v1.0.0 release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file docs/releases/v1.0.0.md
          fi

      - name: Commit sanitized examples
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: replace project-specific data with public placeholders'
          git push
