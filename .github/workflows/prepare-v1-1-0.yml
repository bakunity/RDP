name: Prepare v1.1.0 OpenSSH release

on:
  push:
    branches:
      - feat/openssh-tunnels-v1-1-0

permissions:
  contents: write

concurrency:
  group: prepare-v1-1-0
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Clone branch without marketplace actions
        run: |
          set -Eeuo pipefail
          git clone \
            --depth=1 \
            --branch feat/openssh-tunnels-v1-1-0 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo
      - name: Apply and validate OpenSSH release patches
        working-directory: repo
        run: |
          set -Eeuo pipefail
          python3 .github/prepare_v1_1_0.py
          python3 .github/finalize_openssh.py
          bash scripts/check-release.sh
      - name: Commit generated patch
        working-directory: repo
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            server/hermes_rdp/bot.py \
            server/hermes_rdp/db.py \
            server/hermes_rdp/__init__.py \
            server/pyproject.toml \
            scripts/install-server.sh \
            scripts/install-client.ps1 \
            VERSION \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'fix: finalize OpenSSH migration and runtime safety'
          git push origin HEAD:feat/openssh-tunnels-v1-1-0
