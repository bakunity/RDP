name: Promote v1.0.1 documentation

on:
  push:
    branches:
      - docs-sanitize-test-guide-v1-0-1

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-sanitize-test-guide-v1-0-1

      - name: Update current documentation to v1.0.1
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('README.md'),
              Path('docs/QUICKSTART.md'),
              Path('docs/INSTALL_SERVER.md'),
              Path('docs/INSTALL_WINDOWS.md'),
              Path('docs/MIGRATION.md'),
              Path('docs/OPERATIONS.md'),
              Path('docs/COMMANDS.md'),
              Path('docs/INDEX.md'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('v1.0.0', 'v1.0.1')
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          row = '| [Тестирование от А до Я](docs/TESTING_A_TO_Z.md) | Полная проверка на отдельном сервере, новом боте и новом Windows-ПК |\n'
          marker = '| [Быстрый старт](docs/QUICKSTART.md) | Развернуть сервер и подключить первый ПК |\n'
          if row not in text:
              text = text.replace(marker, marker + row)
          readme.write_text(text, encoding='utf-8')

          index = Path('docs/INDEX.md')
          text = index.read_text(encoding='utf-8')
          bullet = '- [Тестирование от А до Я](TESTING_A_TO_Z.md) — отдельный сервер, новый бот, новый Windows-ПК и полный acceptance test.\n'
          marker = '- [Быстрый старт](QUICKSTART.md) — сервер, первый ПК и следующий ПК по шагам.\n'
          if bullet not in text:
              text = text.replace(marker, marker + bullet)
          index.write_text(text, encoding='utf-8')

      - name: Commit documentation promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/QUICKSTART.md docs/INSTALL_SERVER.md docs/INSTALL_WINDOWS.md docs/MIGRATION.md docs/OPERATIONS.md docs/COMMANDS.md docs/INDEX.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: promote current guides to v1.0.1'
          git push
