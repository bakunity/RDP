name: Normalize PowerShell encoding

on:
  push:
    branches:
      - feat/multi-pc-v1

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-pc-v1
      - name: Add UTF-8 BOM to PowerShell files
        shell: python
        run: |
          from pathlib import Path

          for path in Path('.').rglob('*.ps1'):
              raw = path.read_bytes()
              text = raw.decode('utf-8-sig')
              path.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
      - name: Commit normalized files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.ps1'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: use UTF-8 BOM for Windows PowerShell 5.1'
          git push
