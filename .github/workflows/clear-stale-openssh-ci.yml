name: Clear stale OpenSSH CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stale-openssh-ci.yml'
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  clear:
    name: Cancel stale Actions runs
    if: github.event_name == 'push' || github.event.issue.title == 'ci: cancel stale Hermes runs'
    runs-on: windows-2022
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale workflow runs
        shell: powershell
        run: |
          $Headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $RunIds = @(
            '31121438485'
            '31123489566'
            '31123634910'
          )
          foreach ($RunId in $RunIds) {
            $Uri = (
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/" +
              "actions/runs/$RunId/cancel"
            )
            try {
              Invoke-RestMethod -Method Post -Uri $Uri -Headers $Headers
              Write-Host "Cancellation requested for stale run $RunId."
            }
            catch {
              $Status = [int]$_.Exception.Response.StatusCode
              if ($Status -in @(404, 409)) {
                Write-Host "Run $RunId is already finished or unavailable."
                continue
              }
              throw
            }
          }
