              "docs/QUICKSTART.md": f'''# Быстрый старт Hermes RDP

Этот путь рассчитан на чистый Debian/Ubuntu-сервер и Windows 10/11 Pro, Enterprise или Education.

## 1. Что понадобится

- Linux-сервер с публичным IPv4 или доменом;
- root/sudo и systemd;
- свободные TCP-порты `7000`, `7443` и диапазон RDP;
- Telegram bot token и ваш числовой Telegram ID;
- Windows x64 с правами администратора.

Windows Home не является штатным RDP-host и не поддерживается.

## 2. Установка сервера

```bash
curl -fsSL https://raw.githubusercontent.com/bakunity/RDP/{tag}/scripts/install-server.sh -o /tmp/install-hermes-rdp.sh
read -rsp 'Telegram bot token: ' TG_TOKEN; echo
sudo env HERMES_RDP_REF={tag} bash /tmp/install-hermes-rdp.sh \\
  --host SERVER_IP_OR_DOMAIN \\
  --telegram-token "$TG_TOKEN" \\
  --telegram-chat-id TELEGRAM_USER_ID
unset TG_TOKEN
rm -f /tmp/install-hermes-rdp.sh
```

Не публикуйте bot token, pairing-код, API fingerprint или приватные ключи.

## 3. Проверка сервера

```bash
sudo hermes-rdpctl doctor
sudo systemctl is-active hermes-rdp-sshd.service hermes-rdp.service
sudo ss -ltnp | grep -E ':(7000|7443)\\b'
```

Ожидается `api: OK`, `ssh-tunnel: LISTEN 7000` и два активных сервиса.

## 4. Добавление ПК

1. Отправьте `/start` Telegram-боту.
2. Нажмите **➕ ДОБАВИТЬ ПК**.
3. Откройте PowerShell от имени администратора.
4. Вставьте готовую команду из Telegram целиком.
5. Введите понятное название компьютера.
6. Дождитесь `=== ГОТОВО ===`.

Установщик создаёт локальный Ed25519-ключ, проверяет API certificate fingerprint и SSH host key, включает RDP и регистрирует Scheduled Task.

## 5. Подключение

```powershell
mstsc.exe /v:SERVER_IP_OR_DOMAIN:53389
```

Первый ПК обычно получает `53389`, следующий — `53390` и так далее.

## 6. Финальная проверка

- устройство отображается онлайн в Telegram;
- `ssh.exe` работает на Windows;
- внешний порт слушается на сервере;
- RDP открывается из другой сети;
- после перезагрузки Windows туннель восстанавливается автоматически.

Полная процедура: [TESTING_A_TO_Z.md](TESTING_A_TO_Z.md).
''',
              "docs/INSTALL_SERVER.md": f'''# Установка сервера

## Поддерживаемая среда

Debian/Ubuntu, root или sudo, systemd, OpenSSH Server, UFW и Python 3.11+.

## Порты

- `22/tcp` — ваш административный SSH, установщик его не меняет;
- `7000/tcp` — отдельный Hermes OpenSSH daemon;
- `7443/tcp` — HTTPS API;
- `53389–53420/tcp` — RDP endpoints.

## Чистая установка

```bash
curl -fsSL https://raw.githubusercontent.com/bakunity/RDP/{tag}/scripts/install-server.sh -o /tmp/install-hermes-rdp.sh
read -rsp 'Telegram bot token: ' TG_TOKEN; echo
sudo env HERMES_RDP_REF={tag} bash /tmp/install-hermes-rdp.sh \\
  --host SERVER_IP_OR_DOMAIN \\
  --telegram-token "$TG_TOKEN" \\
  --telegram-chat-id TELEGRAM_USER_ID \\
  --api-port 7443 \\
  --ssh-port 7000 \\
  --port-start 53389 \\
  --port-end 53420
unset TG_TOKEN
rm -f /tmp/install-hermes-rdp.sh
```

## Что создаётся

- `/opt/hermes-rdp/app`;
- `/etc/hermes-rdp/config.json`;
- `/etc/hermes-rdp/tls/`;
- отдельный SSH host key;
- `/var/lib/hermes-rdp/state.sqlite3`;
- `hermes-rdp.service`;
- `hermes-rdp-sshd.service`;
- системные пользователи `hermes-rdp` и `hermes-tunnel`.

## Проверка

```bash
sudo hermes-rdpctl doctor
sudo systemctl status hermes-rdp-sshd.service hermes-rdp.service --no-pager
sudo /usr/sbin/sshd -t -f /etc/hermes-rdp/sshd_config
```

До подключения первого ПК RDP-порты должны быть закрыты. Порт появляется только после успешного reverse-туннеля.

## Повторная установка

Установщик создаёт backup в `/var/backups/hermes-rdp/`. Переход с FRP требует явного `--migrate`; чистой OpenSSH-установке этот флаг не нужен.
''',
              "docs/INSTALL_WINDOWS.md": '''# Установка Windows-клиента

## Требования

- Windows 10/11 Pro, Enterprise или Education x64;
- PowerShell 5.1+;
- права локального администратора;
- встроенный OpenSSH Client или возможность установить Windows Capability;
- доступ к серверу на `7000/tcp` и `7443/tcp`.

Windows Home не поддерживает входящие RDP-сессии штатными средствами.

## Установка

1. В Telegram отправьте `/start`.
2. Нажмите **➕ ДОБАВИТЬ ПК**.
3. Откройте PowerShell от имени администратора.
4. Скопируйте команду из Telegram целиком.
5. Введите название компьютера.

Не публикуйте pairing-код и fingerprint. Pairing-код одноразовый и ограничен по времени.

## Что делает установщик

- проверяет редакцию и архитектуру Windows;
- находит или устанавливает OpenSSH Client;
- останавливает старые Hermes/FRP задачи;
- сохраняет legacy-установку отдельно;
- создаёт Ed25519 keypair локально;
- отправляет серверу только public key;
- проверяет HTTPS certificate fingerprint;
- получает и закрепляет SSH host key;
- включает RDP и Windows Firewall rules;
- создаёт `Hermes RDP Agent` от имени `SYSTEM`;
- запускает reverse SSH-туннель.

## Успешный результат

```text
=== ГОТОВО ===
Компьютер: office-pc
RDP: SERVER:53389
Туннель: OpenSSH
Задача: Hermes RDP Agent
```

## Проверка

```powershell
Get-ScheduledTask -TaskName 'Hermes RDP Agent'
Get-Process ssh -ErrorAction SilentlyContinue
Get-Content 'C:\ProgramData\HermesRDP\agent.log' -Tail 50
```

## Повторная установка поверх старой версии

Legacy-каталог переносится в `C:\ProgramData\HermesRDP-legacy-*`. Установщик не должен читать защищённые старые private keys пофайлово. Не удаляйте backup до успешного теста новой установки.
''',
              "docs/ARCHITECTURE.md": '''# Архитектура Hermes RDP

## Общая схема

```text
Remote RDP client
        |
        | TCP SERVER:RDP_PORT
        v
Linux server listener created by sshd
        |
        | reverse forwarding
        v
Windows 127.0.0.1:3389
```

Windows всегда инициирует исходящее SSH-соединение. Проброс портов на домашнем роутере Windows-ПК не требуется.

## Сервер

### `hermes-rdp-sshd.service`

Отдельный экземпляр OpenSSH на `7000/tcp`. Он не заменяет административный SSH сервера и использует собственный config, pid file и host key.

Ограничения:

- только пользователь `hermes-tunnel`;
- только public-key authentication;
- нет shell, PTY, SFTP, X11, agent forwarding и local forwarding;
- `AuthorizedKeysCommand` получает ключ из SQLite;
- `permitlisten` разрешает только назначенный RDP-порт.

### `hermes-rdp.service`

Запускает:

- HTTPS API;
- Telegram controller;
- SQLite registry;
- обработку pairing, telemetry и команд.

### SQLite

Хранит устройства, хэши API-token, SSH public keys, назначенные порты, pairing-коды, команды, настройки Telegram и последнюю телеметрию.

## Windows

`HermesRdpAgent.ps1` работает через Scheduled Task от имени `SYSTEM` и поддерживает:

- `ssh.exe -N -R`;
- reconnect/backoff;
- heartbeat и telemetry;
- команды ON/OFF/RESTART;
- endpoint status.

Приватный Ed25519-ключ остаётся в `C:\ProgramData\HermesRDP` с ACL только для `SYSTEM` и Administrators.

## Trust chain

1. Пользователь получает API fingerprint из доверенного Telegram/серверного вывода.
2. Установщик закрепляет SHA-256 сертификата HTTPS API.
3. Через закреплённый API клиент получает SSH host key.
4. SSH использует `StrictHostKeyChecking=yes` и отдельный `known_hosts`.
5. Сервер принимает public key только для назначенного порта.

## Удаление устройства

DELETE отзывает API-token и SSH public key, закрывает listener и освобождает порт. Локальные файлы Windows удаляются отдельным uninstall-скриптом.
''',
              "docs/OPERATIONS.md": '''# Эксплуатация

## Состояние

```bash
sudo hermes-rdpctl doctor
sudo systemctl status hermes-rdp-sshd.service hermes-rdp.service --no-pager
sudo ss -ltnp | grep -E ':(7000|7443|5338[9]|5339[0-9])\\b'
```

## Логи

```bash
sudo journalctl -u hermes-rdp-sshd.service -n 100 --no-pager
sudo journalctl -u hermes-rdp.service -n 100 --no-pager
```

Логи могут содержать адреса и идентификаторы. Перед публикацией удаляйте секреты, pairing-коды, tokens и fingerprints.

## Перезапуск

```bash
sudo systemctl restart hermes-rdp-sshd.service hermes-rdp.service
```

## Backup

Сохраняйте:

- `/etc/hermes-rdp`;
- `/var/lib/hermes-rdp/state.sqlite3`;
- systemd units;
- текущий repository ref.

```bash
sudo tar -C / -czf /var/backups/hermes-rdp/manual-$(date -u +%Y%m%dT%H%M%SZ).tar.gz \\
  etc/hermes-rdp var/lib/hermes-rdp \\
  etc/systemd/system/hermes-rdp.service \\
  etc/systemd/system/hermes-rdp-sshd.service
```

## Обновление

Используйте фиксированный release tag и `scripts/update-server.sh`. Перед обновлением проверьте release notes и наличие backup.

## Отзыв устройства

Удаление в Telegram отзывает credentials и закрывает listener. После удаления проверьте, что внешний порт больше не слушается.

## После перезагрузки

Оба server service должны стартовать автоматически. Windows Scheduled Task запускается с задержкой и восстанавливает туннель без входа пользователя.
''',
              "docs/TROUBLESHOOTING.md": '''# Диагностика

## Сервер не проходит doctor

```bash
sudo hermes-rdpctl doctor
sudo systemctl status hermes-rdp-sshd.service hermes-rdp.service --no-pager
sudo journalctl -u hermes-rdp.service -n 100 --no-pager
```

## Порт 7000 не слушается

```bash
sudo /usr/sbin/sshd -t -f /etc/hermes-rdp/sshd_config
sudo journalctl -u hermes-rdp-sshd.service -n 100 --no-pager
sudo ss -ltnp 'sport = :7000'
```

## Windows installer: Access denied в старом `winmon`/ключе

Используйте актуальный установщик. Он переносит legacy-каталог целиком и при необходимости исправляет ACL только внутри `C:\ProgramData\HermesRDP`.

## Установка завершилась, но `ssh.exe` не работает

```powershell
Get-ScheduledTaskInfo -TaskName 'Hermes RDP Agent'
Get-Content 'C:\ProgramData\HermesRDP\agent.log' -Tail 100
Get-Process ssh -ErrorAction SilentlyContinue
Test-NetConnection SERVER -Port 7000
```

## ПК offline в Telegram

Проверьте время последнего heartbeat, Scheduled Task, доступ к `7443/tcp` и лог агента.

## RDP-порт закрыт

Это нормально до поднятия reverse-туннеля. После подключения Windows:

```bash
sudo ss -ltnp 'sport = :53389'
```

## RDP-порт открыт, но вход не проходит

Проверьте Windows edition, `TermService`, NLA, firewall и корректные Windows credentials. Hermes не обходит парольную политику Windows.

## Устройство удалено, но локальный агент остался

Сервер уже не примет отозванный ключ. Для локальной очистки запустите `scripts/uninstall-client.ps1` от администратора.
''',
              "docs/TESTING_A_TO_Z.md": '''# Тестирование Hermes RDP от А до Я

## A. Сервер

- [ ] `hermes-rdpctl doctor` без ошибок.
- [ ] `hermes-rdp-sshd.service` active/enabled.
- [ ] `hermes-rdp.service` active/enabled.
- [ ] `7000/tcp` и `7443/tcp` слушаются.
- [ ] RDP-пул закрыт до подключения устройств.
- [ ] `/usr/sbin/sshd -t -f /etc/hermes-rdp/sshd_config` проходит.

## B. Telegram

- [ ] `/start` показывает OpenSSH и пустой список.
- [ ] **➕ ДОБАВИТЬ ПК** создаёт новый код.
- [ ] Команда копируется одним блоком.
- [ ] Посторонний Telegram ID не получает доступ.

## C. Windows install

- [ ] PowerShell запущен администратором.
- [ ] OpenSSH Client найден или установлен.
- [ ] Legacy Hermes-каталог не блокирует установку.
- [ ] `=== ГОТОВО ===` отображается.
- [ ] Создан `device.json`, `known_hosts`, Ed25519 keypair.
- [ ] ACL secrets доступны только SYSTEM и Administrators.
- [ ] Scheduled Task активна.

## D. Туннель

- [ ] `ssh.exe` запущен.
- [ ] Назначенный порт слушается на сервере.
- [ ] Другой порт из пула не занят этим ключом.
- [ ] Telegram показывает ONLINE и LIVE-метрики.

## E. RDP

- [ ] Подключение работает из другой сети.
- [ ] Проверен вход с телефона через мобильные данные или иной внешний канал.
- [ ] Используется сильный Windows-пароль и NLA.

## F. Управление

- [ ] OFF закрывает listener.
- [ ] ON восстанавливает listener.
- [ ] RESTART пересоздаёт SSH-процесс.
- [ ] DELETE отзывает ключ и освобождает порт.

## G. Recovery

- [ ] После перезагрузки Windows туннель возвращается за 30–90 секунд.
- [ ] После перезагрузки сервера оба systemd service возвращаются.
- [ ] Краткий обрыв интернета приводит к reconnect.

## H. Несколько устройств

- [ ] Второй ПК получает следующий свободный порт.
- [ ] Ключ первого ПК не может занять порт второго.
- [ ] Удаление одного устройства не влияет на остальные.

## Критерий PASS

Релиз считается проверенным только после успешного внешнего RDP, recovery после перезагрузки и теста минимум двух устройств.
''',
              "docs/SECURITY.md": '''# Модель безопасности Hermes RDP

## Защищаемые активы

- Telegram bot token;
- API certificate private key;
- Windows Ed25519 private keys;
- device API-tokens;
- pairing-коды;
- Windows credentials;
- SQLite registry.

## Серверные границы

Hermes использует отдельный `sshd`, не изменяя административный SSH на порту 22. Tunnel-user не получает shell, PTY, SFTP, local forwarding, agent forwarding или произвольный remote port.

`AuthorizedKeysCommand` выдаёт ключ вместе с `restrict` и `permitlisten` только для назначенного endpoint.

## Клиентская trust chain

- HTTPS API проверяется по SHA-256 fingerprint;
- SSH host key приходит через уже закреплённый API;
- `StrictHostKeyChecking` запрещает незаметную замену сервера;
- private key остаётся на Windows;
- secret files получают ACL только SYSTEM и Administrators.

## Pairing

Код одноразовый и ограничен по времени. Device создаётся атомарно после проверки public key. При ошибке после pairing установщик пытается отозвать созданное устройство.

## Telegram

Контроллер сверяет chat ID и actor ID. Bot token хранится в root-owned файле и не должен попадать в команды, логи, скриншоты или git.

## RDP boundary

Hermes защищает путь до Windows, но не заменяет безопасность RDP-сессии. Внешний endpoint доступен как TCP-порт сервера. Обязательны:

- сильный уникальный Windows-пароль;
- NLA;
- актуальные обновления Windows;
- минимальное число администраторов;
- ограничение source IP или дополнительный сетевой контроль, когда сценарий это допускает;
- мониторинг неудачных входов.

## Отзыв

DELETE отзывает API-token и SSH public key, завершает listener и освобождает порт. Украденный старый ключ после отзыва не должен аутентифицироваться.

## Что не публиковать

Не публикуйте bot token, pairing-код, TLS fingerprint вместе с командой установки, private key, `device.json`, полный agent log и реальные IP/Telegram IDs из production.
''',
              "docs/MIGRATION.md": f'''# Миграция с FRP на OpenSSH

Переход с `v1.0.x` требует повторного pairing каждого Windows-ПК: старые FRP credentials не преобразуются в SSH keys.

## Сервер

1. Создайте backup `/etc/hermes-rdp`, `/etc/frp`, `/var/lib/hermes-rdp` и systemd units.
2. Проверьте доступ по административному SSH на `22/tcp`.
3. Запустите установщик `{tag}` с `--migrate`.
4. Убедитесь, что `frps.service` и binary удалены.
5. Проверьте `hermes-rdp-sshd.service` и `hermes-rdp.service`.

```bash
sudo env HERMES_RDP_REF={tag} bash /tmp/install-hermes-rdp.sh \\
  --host SERVER_IP_OR_DOMAIN \\
  --telegram-token "$TG_TOKEN" \\
  --telegram-chat-id TELEGRAM_USER_ID \\
  --migrate
```

## Windows

Актуальный установщик:

- останавливает старые FRP/WinMon задачи;
- переносит старый каталог в `HermesRDP-legacy-*`;
- создаёт новый Ed25519 keypair;
- регистрирует устройство заново;
- удаляет старые `frpc.exe`, config и CA из нового рабочего каталога.

## После миграции

- пройдите внешний RDP-тест;
- перезагрузите Windows и проверьте reconnect;
- проверьте OFF/ON/RESTART и DELETE;
- удаляйте legacy backup только после полного PASS.
''',
              "docs/VALIDATED_SCENARIOS.md": '''# Проверенные сценарии

Этот документ фиксирует фактически выполненные проверки без публикации секретов и реальных production-идентификаторов.

## Подтверждено

### Чистая серверная установка

- Debian x86_64;
- OpenSSH Server установлен;
- отдельные `hermes-rdp-sshd.service` и `hermes-rdp.service` active/enabled;
- `doctor` подтвердил API `1.1.0` и OpenSSH transport;
- FRP service и binary отсутствуют;
- база создана с SSH-полями;
- RDP-пул закрыт до подключения устройства.

### Windows pairing

- установщик запущен в PowerShell администратора;
- создан Ed25519 keypair;
- зарегистрирован Scheduled Task;
- reverse SSH-туннель запущен;
- первый endpoint назначен из стандартного пула.

### Внешнее подключение

- Remote Desktop подключился с телефона;
- телефон использовал мобильные данные, а не локальную сеть Windows-ПК;
- тем самым подтверждён полный внешний путь `mobile network → Linux server → reverse SSH → Windows RDP`.

## Найденный дефект

Повторная установка поверх старого WinMon/FRP-каталога могла завершиться `Access denied` при рекурсивном копировании защищённого private key. Исправление: переносить legacy-каталог целиком и применять ACL fallback только к каталогу Hermes.

## Ещё требуется

- второй Windows-ПК;
- восстановление после перезагрузки Windows;
- OFF/ON/RESTART;
- DELETE и повторное использование освобождённого порта;
- recovery после перезагрузки сервера.
''',
