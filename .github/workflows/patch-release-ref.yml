name: Patch release ref

on:
  push:
    branches:
      - docs-release-v1-0-0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-release-v1-0-0
      - name: Pin generated client installer to selected source ref
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/install-server.sh')
          text = path.read_text(encoding='utf-8')
          old = '"client_installer_url": "https://raw.githubusercontent.com/$REPO/main/scripts/install-client.ps1"'
          new = '"client_installer_url": "https://raw.githubusercontent.com/$REPO/$REF/scripts/install-client.ps1"'
          if old not in text and new not in text:
              raise SystemExit('expected client_installer_url line not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install-server.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: pin generated Windows installer to selected release ref'
          git push
