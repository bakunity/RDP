name: Prepare v1.0.4 Telegram copy hotfix

on:
  push:
    branches:
      - fix/telegram-copy-command-v1-0-4

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-copy-command-v1-0-4

      - name: Patch Telegram pair command and release metadata
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          old = '1.0.3'
          new = '1.0.4'

          bot = root / 'server/hermes_rdp/bot.py'
          text = bot.read_text(encoding='utf-8')

          if 'import html\n' not in text:
              if 'import json\n' not in text:
                  raise SystemExit('bot import anchor missing')
              text = text.replace('import json\n', 'import html\nimport json\n', 1)

          plain_command = '            f"{command}"\n'
          code_command = '            f"<pre><code>{html.escape(command)}</code></pre>"\n'
          if plain_command not in text:
              raise SystemExit('plain pair command anchor missing')
          text = text.replace(plain_command, code_command, 1)

          edit_payload = (
              '                            "text": text,\n'
              '                            "reply_markup": keyboard,\n'
          )
          edit_payload_html = (
              '                            "text": text,\n'
              '                            "parse_mode": "HTML",\n'
              '                            "reply_markup": keyboard,\n'
          )
          if edit_payload not in text:
              raise SystemExit('editMessageText payload anchor missing')
          text = text.replace(edit_payload, edit_payload_html, 1)

          send_payload = (
              '                    "text": text,\n'
              '                    "reply_markup": keyboard,\n'
          )
          send_payload_html = (
              '                    "text": text,\n'
              '                    "parse_mode": "HTML",\n'
              '                    "reply_markup": keyboard,\n'
          )
          if send_payload not in text:
              raise SystemExit('sendMessage payload anchor missing')
          text = text.replace(send_payload, send_payload_html, 1)
          bot.write_text(text, encoding='utf-8')

          test_lines = [
              'from __future__ import annotations',
              '',
              'import tempfile',
              'import unittest',
              'from pathlib import Path',
              '',
              'from hermes_rdp.bot import TelegramBot',
              'from hermes_rdp.config import Config',
              '',
              '',
              'class FakeRegistry:',
              '    def __init__(self) -> None:',
              '        self.settings = {',
              '            "screen": "pair",',
              '            "pair_code": "ABCD1234",',
              '            "dashboard_message_id": "",',
              '        }',
              '',
              '    def get_setting(self, key: str, default: str = "") -> str:',
              '        return self.settings.get(key, default)',
              '',
              '    def set_setting(self, key: str, value: str) -> None:',
              '        self.settings[key] = value',
              '',
              '',
              'class TelegramPairCommandTests(unittest.TestCase):',
              '    def setUp(self) -> None:',
              '        self.temp = tempfile.TemporaryDirectory()',
              '        root = Path(self.temp.name)',
              '        token = root / "telegram-token"',
              '        fingerprint = root / "api.sha256"',
              '        frp_token = root / "frp-token"',
              '        token.write_text("test-token", encoding="utf-8")',
              '        fingerprint.write_text("AA11BB22", encoding="utf-8")',
              '        frp_token.write_text("frp-token", encoding="utf-8")',
              '        self.registry = FakeRegistry()',
              '        self.config = Config(',
              '            public_host="server.example",',
              '            api_port=7443,',
              '            frp_bind_port=7000,',
              '            port_start=53389,',
              '            port_end=53420,',
              '            data_dir=root,',
              '            db_path=root / "state.sqlite3",',
              '            telegram_token_file=token,',
              '            telegram_chat_id="123",',
              '            tls_cert_file=root / "api.crt",',
              '            tls_key_file=root / "api.key",',
              '            tls_fingerprint_file=fingerprint,',
              '            frp_token_file=frp_token,',
              '            frp_ca_file=root / "frp-ca.crt",',
              '            client_installer_url="https://example.test/install-client.ps1?a=1&b=2",',
              '        )',
              '        self.bot = TelegramBot(self.config, self.registry)',
              '',
              '    def tearDown(self) -> None:',
              '        self.temp.cleanup()',
              '',
              '    def test_pair_command_is_one_html_code_block(self) -> None:',
              '        text, _ = self.bot._pair()',
              '        self.assertEqual(text.count("<pre><code>"), 1)',
              '        self.assertEqual(text.count("</code></pre>"), 1)',
              '        self.assertIn("&amp; ([scriptblock]", text)',
              '        self.assertIn("a=1&amp;b=2", text)',
              '        self.assertNotIn("\n& ([scriptblock]", text)',
              '',
              '    def test_render_requests_html_parse_mode(self) -> None:',
              '        calls = []',
              '',
              '        def fake_api_call(method, payload=None, timeout=40):',
              '            calls.append((method, payload, timeout))',
              '            return {"message_id": 77}',
              '',
              '        self.bot.api_call = fake_api_call',
              '        self.bot.render()',
              '        method, payload, _ = calls[-1]',
              '        self.assertEqual(method, "sendMessage")',
              '        self.assertEqual(payload["parse_mode"], "HTML")',
              '        self.assertIn("<pre><code>", payload["text"])',
              '',
              '',
              'if __name__ == "__main__":',
              '    unittest.main()',
              '',
          ]
          (root / 'tests/test_bot_pair_copy.py').write_text('\n'.join(test_lines), encoding='utf-8')

          excluded = {
              Path('CHANGELOG.md'),
              Path('docs/releases/v1.0.0.md'),
              Path('docs/releases/v1.0.1.md'),
              Path('docs/releases/v1.0.2.md'),
              Path('docs/releases/v1.0.3.md'),
              Path('.github/workflows/prepare-v1-0-4.yml'),
          }
          allowed = {'.md', '.py', '.toml', '.html', '.xml', '.txt', '.json', '.sh', '.js', '.css'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in excluded:
                  continue
              if path.name != 'VERSION' and path.suffix.lower() not in allowed:
                  continue
              data = path.read_text(encoding='utf-8')
              updated = data.replace('v' + old, 'v' + new).replace(old, new)
              if updated != data:
                  path.write_text(updated, encoding='utf-8')

          (root / 'VERSION').write_text(new + '\n', encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## [1.0.3] — 2026-08-06\n'
          section = '\n'.join([
              '## [1.0.4] — 2026-08-06',
              '',
              'UX-патч Telegram-экрана добавления Windows-ПК.',
              '',
              '### Изменено',
              '',
              '- команда установки выводится единым моноширинным блоком Telegram;',
              '- всю PowerShell-команду можно скопировать одним нажатием;',
              '- включён HTML parse mode для отправки и редактирования панели;',
              '- команда HTML-экранируется, поэтому `&`, ссылки и другие специальные символы не ломают сообщение;',
              '- добавлены regression tests формата команды и Telegram payload.',
              '',
              '### Совместимость',
              '',
              '- API, SQLite registry, pairing contract, FRP и Windows agent не изменены;',
              '- обновление затрагивает только отображение Telegram-панели;',
              '- стандартные порты не изменены.',
              '',
              '',
          ])
          if marker not in changelog:
              raise SystemExit('CHANGELOG insertion marker missing')
          changelog = changelog.replace('Пока нет изменений после `v1.0.3`.', 'Пока нет изменений после `v1.0.4`.')
          changelog = changelog.replace(marker, section + marker, 1)
          changelog = changelog.replace('[Unreleased]: https://github.com/bakunity/RDP/compare/v1.0.3...HEAD', '[Unreleased]: https://github.com/bakunity/RDP/compare/v1.0.4...HEAD')
          changelog = changelog.replace('[1.0.3]: https://github.com/bakunity/RDP/releases/tag/v1.0.3', '[1.0.4]: https://github.com/bakunity/RDP/releases/tag/v1.0.4\n[1.0.3]: https://github.com/bakunity/RDP/releases/tag/v1.0.3')
          changelog_path.write_text(changelog, encoding='utf-8')

          notes = '\n'.join([
              '# Hermes RDP v1.0.4',
              '',
              'UX-патч Telegram-панели добавления Windows-ПК.',
              '',
              '## Изменено',
              '',
              'PowerShell-команда установки теперь выводится единым моноширинным блоком. В Telegram её можно скопировать целиком одним нажатием, без ручного выделения длинной строки.',
              '',
              'Команда HTML-экранируется, поэтому специальные символы внутри URL и PowerShell не ломают разметку сообщения.',
              '',
              '## Совместимость',
              '',
              '- серверный API и Windows agent не изменены;',
              '- схема SQLite и pairing contract не изменены;',
              '- обновление затрагивает только Telegram UI;',
              '- стандартные порты не изменены.',
              '',
              '## Ссылки',
              '',
              '- [GitHub Release v1.0.4](https://github.com/bakunity/RDP/releases/tag/v1.0.4)',
              '- [Тестирование от А до Я](https://github.com/bakunity/RDP/blob/v1.0.4/docs/TESTING_A_TO_Z.md)',
              '',
          ])
          (root / 'docs/releases/v1.0.4.md').write_text(notes, encoding='utf-8')

      - name: Validate patched tree
        run: bash scripts/check-release.sh

      - name: Commit hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: make Telegram installer command copyable'
          git push
