name: Prepare v1.0.5 compact Telegram command

on:
  push:
    branches:
      - fix/compact-telegram-command-v1-0-5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-telegram-command-v1-0-5

      - name: Prepare patch
        run: python3 scripts/prepare_v1_0_5.py

      - name: Validate release tree
        run: bash scripts/check-release.sh

      - name: Commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: compact Telegram command and restart updated services'
          git push
