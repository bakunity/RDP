name: Patch Vercel production URL

on:
  push:
    branches:
      - chore/vercel-production-url

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/vercel-production-url

      - name: Replace old project domain
        shell: python
        run: |
          from pathlib import Path

          old_values = (
              'https://rdp.apruxdomain.lol/',
              'https://rdp.apruxdomain.lol',
          )
          new = 'https://hermes-rdp.vercel.app/'
          allowed = {'.html', '.md', '.xml', '.txt', '.json', '.yml', '.yaml', '.js', '.css'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() == '.github/workflows/patch-vercel-url.yml':
                  continue
              if path.suffix.lower() not in allowed:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              updated = text
              for old in old_values:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else 'none')

      - name: Commit URL update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No files changed.'
            exit 0
          fi
          git commit -m 'docs: point website metadata to Vercel production URL'
          git push
