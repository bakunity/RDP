name: Prepare v1.1.0 OpenSSH release

on:
  push:
    branches:
      - feat/openssh-tunnels-v1-1-0

permissions:
  contents: write

concurrency:
  group: prepare-v1-1-0
  cancel-in-progress: true

jobs:
  patch:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openssh-tunnels-v1-1-0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply OpenSSH release patches
        run: |
          python .github/prepare_v1_1_0.py
          python .github/finalize_openssh.py
      - name: Validate release tree
        run: bash scripts/check-release.sh
      - name: Commit generated patch
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            server/hermes_rdp/bot.py \
            server/hermes_rdp/db.py \
            server/hermes_rdp/__init__.py \
            server/pyproject.toml \
            scripts/install-server.sh \
            scripts/install-client.ps1 \
            VERSION \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'fix: finalize OpenSSH migration and runtime safety'
          git push
