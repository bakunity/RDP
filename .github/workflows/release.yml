name: Publish release

# Release tags point to the exact validated main commit that triggered this workflow.
# Versioned docs/releases/vX.Y.Z.md files are the GitHub Release body source of truth.
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-rdp-release
  cancel-in-progress: true

jobs:
  release:
    name: Tag and publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch release history without marketplace actions
        run: |
          set -Eeuo pipefail
          git init repo
          cd repo
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=100 origin main
          git checkout --detach FETCH_HEAD

      - name: Validate release tree
        working-directory: repo
        run: bash scripts/check-release.sh

      - name: Resolve version and release commit
        id: version
        working-directory: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test -s "$NOTES"
          test -n "$RELEASE_SHA"
          git cat-file -e "$RELEASE_SHA^{commit}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        working-directory: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          RELEASE_SHA='${{ steps.version.outputs.release_sha }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Hermes RDP $TAG" "$RELEASE_SHA"
          git push origin "$TAG"

      - name: Publish or synchronize current GitHub Release
        working-directory: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          NOTES='${{ steps.version.outputs.notes }}'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hermes RDP $TAG" \
              --notes-file "$NOTES"
            echo "Release $TAG synchronized from $NOTES."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes RDP $TAG" \
            --notes-file "$NOTES" \
            --verify-tag

      - name: Synchronize changed historical release notes
        if: github.event_name == 'push'
        working-directory: repo
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'No usable previous push SHA; skipping historical release-note sync.'
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=100 origin "$BEFORE_SHA"
          fi
          git cat-file -e "$BEFORE_SHA^{commit}"

          mapfile -t CHANGED_NOTES < <(
            git diff --name-only "$BEFORE_SHA" HEAD -- 'docs/releases/v*.md'
          )

          if (( ${#CHANGED_NOTES[@]} == 0 )); then
            echo 'No changed versioned historical release notes.'
            exit 0
          fi

          for NOTES in "${CHANGED_NOTES[@]}"; do
            TAG="$(basename "$NOTES" .md)"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if [[ "$TAG" == "$CURRENT_TAG" ]]; then
              continue
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Hermes RDP $TAG" \
                --notes-file "$NOTES"
              echo "Historical release $TAG synchronized from $NOTES."
            else
              echo "No published GitHub Release for $TAG; leaving notes file only."
            fi
          done
